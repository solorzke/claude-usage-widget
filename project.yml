name: ClaudeUsage
options:
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  ClaudeUsage:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - target: ClaudeUsageWidget
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: Claude Usage
        ClaudeAppGroup: $(APP_GROUP)
        LSUIElement: true
    entitlements:
      path: Support/App.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP)"]
    settings:
      base:
        PRODUCT_NAME: Claude Usage
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ClaudeUsage
  ClaudeUsageWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: Claude Usage
        ClaudeAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: ["$(APP_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ClaudeUsage.Widget
